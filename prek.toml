default_install_hook_types = [
    "pre-commit",
    "commit-msg",
    "post-checkout",
    "post-merge",
]

[[repos]]
repo = "builtin"

    [[repos.hooks]]
    id = "check-merge-conflict"

    [[repos.hooks]]
    id = "end-of-file-fixer"

    [[repos.hooks]]
    id = "trailing-whitespace"
    args = [
        "--markdown-linebreak-ext=md",
    ]

[[repos]]
repo = "local"

    [[repos.hooks]]
    id = "ruff-check"
    name = "ruff: check"
    entry = "ruff check src"
    language = "system"
    types_or = [
        "python",
        "pyi",
        "jupyter",
    ]
    pass_filenames = false
    stages = [
        "pre-commit"
    ]

    [[repos.hooks]]
    id = "ruff-format"
    name = "ruff: format"
    language = "system"
    entry = """ruff format src --config 'lint.ignore=["COM812"]'"""
    types_or = [
        "python",
        "pyi",
        "jupyter",
    ]
    pass_filenames = false
    stages = [
        "pre-commit"
    ]

    [[repos.hooks]]
    id = "ruff-sort-imports"
    name = "ruff: sort imports"
    language = "system"
    entry = "ruff check src --fix --select I"
    types_or = [
        "python",
        "pyi",
        "jupyter",
    ]
    pass_filenames = false
    stages = [
        "pre-commit"
    ]

    [[repos.hooks]]
    id = "pyrefly"
    name = "pyrefly"
    language = "system"
    entry = "pyrefly check src"
    types_or = [
        "python",
        "pyi",
        "jupyter",
    ]
    pass_filenames = false
    stages = [
        "pre-commit"
    ]

    [[repos.hooks]]
    id = "uv-sync"
    name = "uv: sync"
    language = "system"
    entry = "uv sync --frozen"
    pass_filenames = false
    stages = [
        "post-merge",
        "post-checkout",
    ]

    [[repos.hooks]]
    id = "uv-lock"
    name = "uv: lock"
    entry = "uv lock"
    language = "system"
    files = '^(uv\.lock|pyproject\.toml|uv\.toml)$'
    pass_filenames = false
    stages = [
        "pre-commit"
    ]

    [[repos.hooks]]
    id = "mise-install"
    name = "mise: install"
    language = "system"
    entry = "mise install --locked"
    pass_filenames = false
    stages = [
        "post-merge",
        "post-checkout",
    ]


    [[repos.hooks]]
    id = "mise-lock"
    name = "mise: lock"
    language = "system"
    entry = "mise lock"
    files = '^mise.toml$'
    pass_filenames = false
    stages = [
        "pre-commit"
    ]
